# Supply-chain policy for `ae`. Committed, because the policy IS the check —
# cargo-deny with a default config asserts almost nothing.
#
# cargo-deny covers the RustSec advisory database directly, so cargo-audit is a
# duplicate lane and is deliberately absent (#80).

[graph]
# Both targets ae ships. Restricting the graph keeps the check honest: a
# platform we do not ship is a platform whose advisories are noise.
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-unknown-linux-musl" },
]
all-features = true

[output]
feature-depth = 1

[advisories]
# RustSec. A known-vulnerable or yanked dependency fails the lane; there is no
# "warn" that survives contact with a release.
yanked = "deny"
unmaintained = "all"
# Every entry here must carry a reason and a reference. An empty list is the
# only state that needs no justification.
ignore = []

[licenses]
# Permissive only. ae is MIT and ships as one binary — a copyleft dependency
# changes the distribution contract, so it needs a deliberate exception rather
# than a silent pass.
#
# MINIMAL-TO-ENCOUNTERED as of the first dependency (2026-08-29, P4.3 tracer A):
# exactly the four licenses the shipped graph resolves to across BOTH targets.
# `just rust-deny` no longer passes `--allow license-not-encountered`, so an
# unmatched entry here is a WARNING that means the allow-list drifted — which
# only works as a signal if the baseline is clean. A speculative forward-looking
# entry (the old list carried Apache-2.0-WITH-LLVM-exception, BSD-2-Clause,
# Unicode-3.0, Zlib, none of them in the graph) is exactly the noise that would
# hide the next real drift. Add a license back HERE, deliberately, the day a
# crate actually needs it — the same rule as "a dependency arrives with the
# feature that needs it".
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC"]
confidence-threshold = 0.9
# webpki-roots ships Mozilla's CA-certificate DATA, not code, under
# CDLA-Permissive-2.0 (Community Data License Agreement — Permissive: a
# permissive DATA license). It arrives transitively through ureq's
# `rustls-webpki-roots` feature, which is not optional — with it off ureq's
# rustls connector reaches `panic!("WebPki is disabled...")` on the first
# request (ureq-3.4.0 src/tls/rustls.rs:200), because a static musl binary has
# no host trust store to fall back to. SCOPED to this one crate rather than
# widening the allow-list above, deliberately: CDLA is a data license, and
# nothing else in ae's graph should acquire it by a silent pass.
# Ref: https://spdx.org/licenses/CDLA-Permissive-2.0.html
exceptions = [{ crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }]

[licenses.private]
# `ae` itself is `publish = false`; it is still MIT and still checked.
ignore = false

[bans]
# A duplicate version is a smell worth seeing, not a defect worth blocking.
multiple-versions = "warn"
# A wildcard version is a reproducibility hole, and this repo's whole toolchain
# doctrine is pins-not-channels.
wildcards = "deny"
highlight = "all"
external-default-features = "allow"
workspace-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# crates.io or nothing. A git dependency is a dependency with no yank, no
# advisory mapping and no immutable version.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# cargo-mutants: does the suite DISCRIMINATE, or does it merely pass?
#
# nextest is the runner here for the same reason it is the runner in
# `just rust-test` — one test tool, one set of semantics. Doctests are not run
# by this lane; they are documentation coverage, not mutation coverage.
test_tool = "nextest"

# A mutant that hangs must not hang the lane. The multiplier is against the
# measured baseline run, so it scales with the suite instead of being a guess.
timeout_multiplier = 5.0
minimum_test_timeout = 20.0

# The criterion-1 control (tests/it/cli.rs) DERIVES its phase-2 baseline from git history
# (`git log -S` + `git show`) instead of a hardcoded sha. cargo-mutants runs the suite in a
# copy of the tree that omits `.git` by default, so the control panicked there ("this control
# needs git and the repository history to be present") and the lane exited 4 before any
# mutant ran. Copying the VCS directory keeps the control honest inside the copy.
copy_vcs = true

# One mutant at a time (`--jobs 1`, pinned in the justfile) and at most four
# tests per run: the lane runs the whole suite once per mutant plus a baseline,
# and a full-width suite per run is what took a laptop to load 26 (#159). This
# reaches nextest for the baseline and every mutant alike.
additional_cargo_test_args = ["--test-threads=4"]

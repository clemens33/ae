# Repo-owned cargo config. Anything here must hold on a FRESH CLONE with only
# rustup + just — no brew, no sccache, no alternative linker. Machine-local
# speedups belong in ~/.cargo/config.toml, which cargo merges on top of this.

[alias]
# Shorthands for the inner loop and for agents that reach for cargo directly.
#
# `lint` carries `-D warnings` so it AGREES with `just rust-lint`: without it the
# alias reports success on the very warnings the gate rejects, which is worse
# than having no alias — a false green is trusted, a missing tool is noticed.
# It is still NOT the whole lane: `just rust-lint` also runs `taplo lint`, and
# nothing here can check TOML.
#
# `--locked` for the same reason it is on every justfile lane: a lane that lets
# cargo rewrite Cargo.lock to succeed is not enforcing the committed lockfile.
lint = "clippy --locked --all-targets --all-features -- -D warnings"
xcheck = "check --locked --target x86_64-unknown-linux-musl"

# LINKER: stock. macOS ships a fast enough `ld` for a crate this size, and a
# custom linker (mold/lld/zld) is a machine dependency the bootstrap contract
# does not promise. Revisit when a measured link time justifies it.

# sccache: deliberately NOT enabled here. `build.rustc-wrapper` is a hard
# requirement the moment it is written — a clone without sccache then fails to
# build. Enable it per-machine in ~/.cargo/config.toml:
#     [build]
#     rustc-wrapper = "sccache"

[future-incompat-report]
frequency = "always"

# THE CROSS TOOLCHAIN, AND IT IS TARGET-SCOPED ON PURPOSE. This section is read
# only when something asks for x86_64-unknown-linux-musl. A bare clone that
# builds native — `just rust-check`, `just rust-build-release`, `cargo test` —
# never resolves it and never needs the compiler it names, so the fresh-clone
# contract (rustup + just, nothing else) is unchanged.
#
# It exists because `just bundles` builds BOTH release halves on an Apple
# Silicon laptop. rustc's default linker for a musl target is `cc`, which on
# macOS is Apple clang: it cannot link ELF. The name below is the one the
# prebuilt Homebrew tap publishes
# (`brew install messense/macos-cross-toolchains/x86_64-unknown-linux-musl`),
# and `just rust-setup` prints that line when the compiler is missing rather
# than installing it — a cross toolchain is a machine dependency, not part of
# the bootstrap contract.
#
# LINUX SPELLS IT DIFFERENTLY, and that is why this is a pin rather than a
# requirement. Ubuntu's `musl-tools` ships `musl-gcc` with no triple-prefixed
# alias, so the two workflow legs that link musl on Linux name their own with
# CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc. A config value an
# environment variable overrides is still the pin: it is what holds when nobody
# says otherwise. Keep this name and `RUST_MUSL_CC` in the justfile identical —
# `tests/it/gate.rs` refuses the drift.
[target.x86_64-unknown-linux-musl]
linker = "x86_64-unknown-linux-musl-gcc"

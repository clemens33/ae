# `unwrap_used` / `expect_used` are the production rule (Cargo.toml [lints]).
# They are NOT the test rule: a test that maps an error to a fallback instead of
# panicking hides the failure it exists to report. Clippy's own switch keeps the
# rule where it belongs rather than scattering `#[allow]` through the suite.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# The capability boundary for running a child process. This resolves TYPES, not
# text, so it holds against UFCS `std::process::Command::output(&mut c)`,
# `use ... as C`, and spellings nobody has thought of yet — a filter over method
# names closes one spelling, not the class.
#
# THE DOORS are inventoried by `tests/it/doors.rs`, which asserts the exact
# number of relaxation sites per file and goes red when one appears or
# vanishes. Product doors, one site each: `src/transport.rs` (`run`, the tmux
# child every liveness answer needs), `src/run.rs` (the exec of the agent
# tool), `src/upgrade.rs` (the `tar` extraction), `src/install.rs` (running
# the verified core to ask its version). Suite doors: `tests/it/cli.rs` (the
# black-box `ae()` runner and its helpers), `tests/it/install.rs`,
# `tests/it/shape.rs`, `tests/it/parity.rs` (`mod raw`), `tests/it/doors.rs`.
# Each carries its reason at the site; the test, not this comment, is the
# count of record.
#
# WHY THIS WAS A BOUNDARY AND WHAT IT IS NOW — READ THIS BEFORE CITING IT.
# The claim below used to be that the deny was a CAPABILITY boundary, resting on
# two premises:
#   * ALL FOUR dependency tables are empty or absent — `[dependencies]`,
#     `[dev-dependencies]`, `[build-dependencies]`, and any
#     `[target."cfg(...)".dependencies]` — so no third-party spawner exists to
#     route around it. All four, deliberately: naming only the first two would
#     leave this sentence TRUE while the claim it supports had become false.
#   * `unsafe_code = "forbid"` — forbid, not deny, so no `#[allow]` anywhere can
#     re-enable it, and there is no libc/syscall route either.
#
# THE FIRST PREMISE FELL ON 2026-08-29 (P4.3 tracer A). `[dependencies]` now
# holds ureq + rustls, and their graph — ring, libc, getrandom and the rest —
# is third-party code this deny does not constrain. `ring` even carries a
# `[build-dependencies]` on `cc`, which compiles and runs a C toolchain at build
# time. Nothing in that graph spawns a child process on ae's behalf today, and
# nothing in ae asks it to; but "no third-party spawner EXISTS" is no longer a
# structural fact, it is an observation about crates ae does not own.
#
# So, precisely: the second premise still holds (`forbid` closes the libc route
# for OUR code), and within ae's OWN source the only way to a child process is
# still this one type — which is what the deny checks and what the inventory
# test enforces. What is gone is the claim about the WHOLE compiled artifact.
# Against ae's own code this is a boundary; against the binary it is now a
# convention plus a supply-chain argument, and the supply-chain half is
# cargo-deny's and cargo-vet's job, not this file's. Do not restore the stronger
# wording without restoring the premise.
#
# The day `forbid` softens too, nothing is left. Whoever adds the SECOND
# dependency inherits a boundary that is already one premise down.
#
# That the deny is still in force is checked SEMANTICALLY, not by reading the
# source for exemptions: see
# `the_capability_boundary_holds_against_any_lint_relaxation` in
# tests/it/doors.rs, which runs clippy under `--force-warn` — a flag
# no `allow`, group `allow`, `cfg_attr`, `expect` or crate-root `#![allow]` can
# override.
disallowed-types = ["std::process::Command"]

# The capability boundary for READING THE OUTSIDE WORLD — the phase-3 gate's
# criterion 3, which requires that presentation re-derives nothing.
#
# WHY A BOUNDARY AND NOT A TEST. An output differential cannot see a read whose
# RESULT IS DISCARDED: a renderer that opens the sessions root and throws the
# answer away changes no byte, and every equivalence test stays green. A source
# scan cannot see one either — it looks for names, and `Path::exists` is a
# filesystem observation under none of the names a reader would think to list.
# So the instrument has to be the compiler: these are resolved as PATHS, not
# text, which holds against aliases, re-imports and UFCS.
#
# WHAT IT DOES NOT CLOSE, stated because a boundary that oversells itself is the
# defect it exists to prevent: this is an enumeration of ENTRY POINTS, not of the
# capability. A syscall reached some way not listed here is not seen. Two things
# used to make the enumeration hold anyway: ALL FOUR dependency tables were
# empty, so no third-party reader existed to route around it, and
# `unsafe_code = "forbid"` closed the libc route.
#
# THE FIRST OF THOSE IS GONE (2026-08-29, P4.3 tracer A): ureq and rustls are
# real dependencies, and ureq reads the filesystem for itself in configurations
# ae does not use. See the longer note above the `disallowed-types` deny — the
# same premise, the same fall, the same conclusion. Over ae's own source this is
# still the enumeration it always was, and the inventory test in
# `tests/it/phase3.rs` still names every module that holds a door. Over the
# compiled artifact it is now a convention. The day `forbid` softens, it is only
# a naming convention.
#
# The allowed sites are enumerated SEMANTICALLY by
# `criterion_3_the_places_this_crate_can_read_the_world_are_the_inventoried_ones`
# in tests/it/phase3.rs, which asks clippy under `--force-warn` — a flag no
# `allow`, `expect` or crate-root attribute can override.
disallowed-methods = [
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::read_dir",
  "std::fs::metadata",
  # The lstat door. Listed BESIDE `metadata` rather than instead of it, because
  # the two are not interchangeable and the difference is a security property:
  # `metadata` FOLLOWS a symlink, `symlink_metadata` classifies the link itself.
  # Every product use here is deliberately the non-following one (the teardown
  # and archive path guards, the watchdog's orchestrator heartbeat, and the
  # strict worker-dir/root classifier, which lstats the optional origin `.ae`
  # first so a dangling link refuses as present-invalid rather than reading as
  # absent), so the entry exists to keep each of them a line in a review rather
  # than to discourage it.
  "std::fs::symlink_metadata",
  "std::fs::File::open",
  "std::path::Path::exists",
  "std::path::Path::metadata",
  "std::path::Path::is_dir",
  "std::path::Path::is_file",
  "std::env::var",
  "std::env::var_os",
  # THE TERMINAL DOOR (`ae app`, 2026-10-03, lead ruling D2 on the sideapp
  # plan). rustix's termios module is how the app takes raw mode, puts the mode
  # back and reads the window size without libc or `unsafe`, and every entry
  # point it exports is listed, not only the three the app calls, so a second
  # caller of ANY of them is a review rather than a diff. The one allowed site is
  # `src/app/tty.rs`, carrying its reason at the allow, and it is inventoried in
  # tests/it/phase3.rs like every door above. rustix is a THIRD-PARTY reader:
  # the note above the list applies to it exactly as to ureq — over ae's own
  # source this is an enumeration, over the compiled artifact a convention.
  # Only the `termios` feature is enabled (Cargo.toml), so no other rustix
  # module exists in the graph to route around this list.
  "rustix::termios::tcgetattr",
  "rustix::termios::tcsetattr",
  "rustix::termios::tcgetwinsize",
  "rustix::termios::tcsetwinsize",
  "rustix::termios::tcgetpgrp",
  "rustix::termios::tcsetpgrp",
  "rustix::termios::tcgetsid",
  "rustix::termios::tcsendbreak",
  "rustix::termios::tcdrain",
  "rustix::termios::tcflush",
  "rustix::termios::tcflow",
  "rustix::termios::isatty",
  "rustix::termios::ttyname",
  "rustix::termios::ioctl_tiocexcl",
  "rustix::termios::ioctl_tiocnxcl",
]

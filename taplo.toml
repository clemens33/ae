# taplo's scope. Default-on for every TOML in the repo so a new one is covered
# the day it lands — with one exclusion.
include = ["**/*.toml"]

# cliff.toml is a bash-era file and is NOT taplo-formatted. Reformatting it here
# would be an unrelated diff in a frozen area; it joins the lane when someone
# deliberately reformats it.
#
# supply-chain/ is cargo-vet's, and cargo-vet OWNS the format of those files — it
# rewrites config.toml/audits.toml on its own runs. taplo and cargo-vet would
# fight over their layout every run, so taplo stays out (same reasoning as
# cliff.toml). cargo-vet's own writer is their formatter.
exclude = ["cliff.toml", "target/**", "supply-chain/**"]

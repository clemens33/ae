name: release

# OPTIONAL, AND OFF THE CRITICAL PATH (ruled 2026-09-04). `just release` builds,
# proves and publishes both platform bundles from a laptop, so a release no
# longer waits on a runner and a red or queued Actions run cannot hold one up.
#
# The job is kept INTACT because it is still the only place a musl binary can
# actually RUN: it executes the cross-built core, checks its version, proves it
# static, and runs both `_net-probe` controls against musl's NSS-less resolver.
# Dispatch it AT A TAG — `gh workflow run release.yml --ref v2026.9.2` — because
# every step derives the version from GITHUB_REF_NAME. Dispatched on a branch it
# refuses at the first `--version` assertion, before any release object exists.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: build linux-x86_64-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools

      # First-party actions only (AGENTS.md), so `just` is installed the same way
      # the rust lanes install it: READ the pin out of the justfile, never
      # restate it. The bundle shape lives in a recipe now, so both platform
      # legs need the tool that runs it.
      - name: Install just (pinned)
        run: |
          set -euo pipefail
          want="$(grep -m1 -E '^JUST_VERSION := ' justfile | cut -d'"' -f2)"
          [ -n "$want" ] || { echo "::error::JUST_VERSION not found in justfile"; exit 1; }
          if just --version 2>/dev/null | grep -Fqx "just $want"; then
            echo "just $want already present"
          else
            cargo install --locked --version "$want" just
          fi

      # `.cargo/config.toml` pins the musl linker to the macOS cross toolchain's
      # name, because that is where `just bundles` links this target. Ubuntu's
      # `musl-tools` ships `musl-gcc` and no triple-prefixed alias, so this leg
      # names its own. A config value an env var overrides is still the pin.
      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify and bundle Linux artifact
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin="target/x86_64-unknown-linux-musl/release/ae"
          want="ae $version"
          got="$($bin --version)"
          [ "$got" = "$want" ] || { echo "::error::--version printed '$got', want '$want'"; exit 1; }

          command -v readelf >/dev/null || { echo "::error::readelf is required"; exit 1; }
          headers="$(readelf -l "$bin")"
          if printf '%s\n' "$headers" | grep -q 'INTERP'; then
            echo "::error::musl binary has a PT_INTERP segment"
            exit 1
          fi
          described="$(file -b "$bin")"
          case "$described" in
            *dynamically*) echo "::error::file reports a dynamic binary: $described"; exit 1 ;;
            *static*) : ;;
            *) echo "::error::file does not report a static binary: $described"; exit 1 ;;
          esac

          set +e
          "$bin" _net-probe ae-release-negative-control.invalid >/dev/null 2>&1
          invalid_code=$?
          set -e
          [ "$invalid_code" -eq 1 ] || { echo "::error::.invalid probe exited $invalid_code, want 1"; exit 1; }
          "$bin" _net-probe api.telegram.org >/dev/null

          just bundle "$version" linux-x86_64-musl "$bin"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ae-linux-x86_64-musl
          path: ae-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build darwin-arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # First-party actions only (AGENTS.md), so `just` is installed the same way
      # the rust lanes install it: READ the pin out of the justfile, never
      # restate it. The bundle shape lives in a recipe now, so both platform
      # legs need the tool that runs it.
      - name: Install just (pinned)
        run: |
          set -euo pipefail
          want="$(grep -m1 -E '^JUST_VERSION := ' justfile | cut -d'"' -f2)"
          [ -n "$want" ] || { echo "::error::JUST_VERSION not found in justfile"; exit 1; }
          if just --version 2>/dev/null | grep -Fqx "just $want"; then
            echo "just $want already present"
          else
            cargo install --locked --version "$want" just
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify and bundle macOS artifact
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin="target/release/ae"
          want="ae $version"
          got="$($bin --version)"
          [ "$got" = "$want" ] || { echo "::error::--version printed '$got', want '$want'"; exit 1; }
          "$bin" _net-probe localhost >/dev/null

          just bundle "$version" darwin-arm64 "$bin"

      - name: Upload macOS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ae-darwin-arm64
          path: ae-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ae-linux-x86_64-musl
          path: release-assets

      - name: Download macOS bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ae-darwin-arm64
          path: release-assets

      - name: Generate checksums and attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          linux="$(find release-assets -name "ae-$version-linux-x86_64-musl.tar.gz" -type f -print -quit)"
          darwin="$(find release-assets -name "ae-$version-darwin-arm64.tar.gz" -type f -print -quit)"
          [ -n "$linux" ] || { echo "::error::Linux bundle is missing"; exit 1; }
          [ -n "$darwin" ] || { echo "::error::macOS bundle is missing"; exit 1; }
          mkdir -p publish
          cp "$linux" "$darwin" publish/
          (cd publish && sha256sum -- ae-*.tar.gz > SHA256SUMS)
          # A retry may reach this job after the release object exists. Upload
          # the freshly generated assets in that case; the first run creates it.
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" publish/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" publish/* \
              -R "$GITHUB_REPOSITORY" \
              --title "ae $version" \
              --generate-notes
          fi

# THE GATE, run natively on both platforms ae ships for.
#
# Two lanes, and together they are ae's whole automated gate: `just rust-check`
# (which `just test` now IS) and `just check`, the bash lane over `install`.
#
# THE BASH LANE USED TO BE DELIBERATELY ABSENT, held out by the gate-integrity
# issues #58/#67 — a red badge for a known, separately-tracked gap was judged
# worse than no badge at all. The trade has flipped. What the lane guards is now
# ONE file, `install`: 79 lines, the only bash ae ships, and a member of every
# release bundle. #67's fix is in the recipe it runs — the `< /dev/null` on
# shellcheck's invocation, pinned structurally by tests/it/gate.rs — the lane
# costs seconds, and until this landed `install` was the one product file no
# automated gate read at all.
#
# This workflow is also the TARGET-NATIVE PROOF the #80 acceptance asks for:
# `ae --version` is executed on real x86_64 Linux and real arm64 macOS, not
# cross-built and assumed.

name: rust

# PATHS FILTER: only changes these lanes can say something about start them.
# Measured cause — a docs slice pushing to this branch every 2-6 minutes started
# a rust run each time, and none of those pushes touched a file below.
#
# `install` is in the list because the bash lane reads it. A filter that starts
# the job for a Rust change but not for the file the job's own lint gates is a
# gate that any `install`-only commit walks straight past.
#
# TRAP, recorded where the decision lives: if `rust` ever becomes a REQUIRED
# status check, a run skipped by this filter reports "skipped", not "success",
# and a docs-only PR can never satisfy it — the merge blocks forever. Revisit
# this filter at that moment (the usual answer is a paths-filtered job plus a
# always-runs gate job that reports success). No branch protection exists today.
on:
  push:
    branches: [main]
    # Spelled out on both triggers rather than shared via a YAML anchor.
    # Anchors are not part of the documented workflow syntax, and NOTHING here
    # can settle the question locally: python yaml resolves them, and actionlint
    # accepts them too (measured) — so an anchor GitHub rejected would surface
    # only as a workflow that silently runs no jobs. Duplication is the one form
    # that is safe under either reading. Keep the two lists in sync by hand.
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - deny.toml
      - clippy.toml
      - taplo.toml
      - supply-chain/**
      - .cargo/**
      - src/**
      - tests/it/**
      - justfile
      - install
      - .github/workflows/rust.yml
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - deny.toml
      - clippy.toml
      - taplo.toml
      - supply-chain/**
      - .cargo/**
      - src/**
      - tests/it/**
      - justfile
      - install
      - .github/workflows/rust.yml
  # The manual escape hatch: run the lanes against any ref regardless of paths.
  workflow_dispatch:
    inputs:
      mutants:
        description: "Also run the FULL mutation lane (hours; 6 h budget). Dispatchable only once this file exists on the default branch."
        type: boolean
        default: false

concurrency:
  group: rust-${{ github.ref }}
  # Cancel only PR runs, where a newer commit genuinely supersedes the old one.
  #
  # PUSH RUNS MUST FINISH. A cancelled job never reaches its Post Cache steps, so
  # cancelling every push run meant the tool cache was never written — and
  # without the cache every run is a cold ~10-15min build that the next push
  # cancels again. That is a livelock, not slowness: measured `caches: 0` across
  # three consecutive cancelled runs on this branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A CI failure must be readable without a local repro.
  RUST_BACKTRACE: 1
  # THE ONE PIN SITE FOR shfmt, and it is here because there is no other: the
  # justfile pins shellcheck (`_shellcheck-pin`, read below rather than
  # restated) and deliberately does not pin shfmt, whose `< /dev/null` it calls
  # insurance rather than contract. CI cannot be that relaxed — shfmt's printer
  # changes between minors (3.14.0 respaced nested parens and `!` in
  # arithmetic), so an unpinned formatter is a gate that goes red on a release
  # nobody here made. Pinned to the version `install` is formatted with.
  SHFMT_VERSION: "3.13.1"

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 45 minutes for a push or PR; 6 hours only for a manual dispatch that asks for the
    # FULL mutation lane (mutants=true). Everything else in this job, the bounded
    # per-push mutation step included, finishes well inside the first budget.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.mutants) && 360 || 45 }}
    strategy:
      # One platform's failure must not cancel the other's evidence — the whole
      # point of this matrix is proving BOTH natively.
      fail-fast: false
      matrix:
        include:
          # Runner images are pins too. `ubuntu-latest` and `macos-latest` are
          # moving channels — the same doctrine that rejects `stable` in
          # rust-toolchain.toml rejects them here.
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-15
            name: macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the criterion-1 control in tests/it/cli.rs DERIVES its phase-2
          # baseline from `git log -S` + `git show <removal>^:src/lib.rs` rather than a
          # hardcoded sha. A depth-1 checkout has no such history and the control panics
          # ("the refusal constant must appear in history") — red on both platforms since
          # the control landed, while the same lane is green on any full clone.
          fetch-depth: 0

      # Pinned dev tools install into a dedicated root, NOT ~/.cargo/bin: caching
      # ~/.cargo/bin would archive and later restore the runner's own
      # rustup/cargo/rustc shims, so a cache saved against one preinstalled
      # rustup could be replayed over a different one.
      #
      # Exported from a STEP, not from job-level `env`: the `runner` context is
      # not available there, and referencing it makes the whole workflow invalid
      # — no job starts at all, so the failure looks like nothing ran.
      - name: Point cargo install at a cacheable root
        run: |
          echo "CARGO_INSTALL_ROOT=$RUNNER_TEMP/ci-tools" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ci-tools/bin" >> "$GITHUB_PATH"

      # tmux is a TEST dependency, not a build one: SC-017k's liveness proof runs
      # two isolated real tmux servers (one -L named, one -S socket) and asserts
      # each answers with only its own sessions. Those tests PANIC with a stated
      # reason when tmux is absent rather than skipping — a silent skip would let
      # the strongest evidence in the phase-2 gate quietly stop running while the
      # suite still reported green, which is the failure this project has now hit
      # three times in other forms.
      #
      # Installed explicitly on both platforms rather than relied on: a runner
      # image that happens to ship tmux today is not a contract, and discovering
      # its absence as a red gate months from now costs more than one line here.
      - name: Install tmux (test dependency)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tmux
          else
            brew list tmux >/dev/null 2>&1 || brew install tmux
          fi
          tmux -V

      # rustup is preinstalled on GitHub runners. The toolchain, its components
      # and its targets all come from rust-toolchain.toml — the same file the
      # laptop resolves — so CI cannot silently drift onto another compiler.
      - name: Show rustup
        run: rustup --version

      # Cache key derives from the PINS THEMSELVES, not from the whole justfile:
      # editing a recipe comment must not evict a slow tool build. Read with grep
      # so no tool is needed before the cache that holds the tools.
      #
      # The bash lane's two tools live in the same cached root, so their pins are
      # in the key as well — the shellcheck one read out of `_shellcheck-pin`,
      # shfmt's from this workflow's env. Without them a bump would be served a
      # stale binary out of a cache whose key never moved. The install step below
      # version-checks what it finds anyway, so this is what keeps a bump CHEAP
      # rather than what keeps it correct.
      - name: Compute pin hash
        id: pins
        run: |
          set -euo pipefail
          hash="$( { grep -E '^[A-Z_]+_VERSION := ' justfile
                     grep -E '^[[:space:]]+want="[0-9]+\.[0-9]+\.[0-9]+"$' justfile
                     printf 'shfmt %s\n' "$SHFMT_VERSION"
                     cat rust-toolchain.toml; } \
                   | shasum -a 256 | cut -d' ' -f1 )"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # `just` plus the six pinned dev tools, all built from source by
      # `cargo install --locked`. Slow exactly once per pin change; after that
      # this cache makes rust-setup a no-op.
      - name: Cache pinned dev tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ci-tools
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: tools-${{ matrix.name }}-${{ steps.pins.outputs.hash }}

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: build-${{ matrix.name }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.name }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            build-${{ matrix.name }}-

      # `just` is a PREREQUISITE of the bootstrap contract, not something
      # rust-setup installs — CI reproduces the prerequisite rather than
      # pretending it is part of the repo's own setup. This is the one pin that
      # must live here, because it has to exist before the justfile can be read.
      - name: Install just (pinned)
        run: |
          set -euo pipefail
          # READ the pin, never restate it: JUST_VERSION lives in the justfile's
          # pins block with the other five, so a bump changes one line and
          # re-keys the tool cache (the pin hash greps *_VERSION lines).
          want="$(grep -m1 -E '^JUST_VERSION := ' justfile | cut -d'"' -f2)"
          [ -n "$want" ] || { echo "::error::JUST_VERSION not found in justfile"; exit 1; }
          if just --version 2>/dev/null | grep -Fqx "just $want"; then
            echo "just $want already present"
          else
            cargo install --locked --version "$want" just
          fi

      # THE BASH LANE'S TOOLS, pinned and PROVEN BY DIGEST before they run.
      #
      # `just check` is worth exactly as much as the two binaries it calls.
      # shellcheck's finding set moves between releases — the reason the justfile
      # pins it at all — and shfmt's printer moves too, so both come from their
      # upstream release assets rather than from apt or brew, neither of which
      # can be asked for a version. They install into the same cached root the
      # cargo tools use, so a warm cache makes this step a no-op.
      #
      # THE VERSION IS READ; THE DIGEST IS TABLED. The shellcheck pin has one
      # home, `_shellcheck-pin` in the justfile, so it is grepped rather than
      # restated here — the same rule the `just` step above follows. A digest can
      # be read from nowhere, so it sits in a table keyed by that version, and a
      # bump to a version with no row FAILS this step saying so. That is the
      # intended cost of a bump: an unverified download is the one outcome a
      # pinned lane must not have.
      - name: Install shellcheck and shfmt (pinned, digest-verified)
        run: |
          set -euo pipefail
          want_sc="$(grep -m1 -E '^[[:space:]]+want="[0-9]+\.[0-9]+\.[0-9]+"$' justfile | cut -d'"' -f2)"
          [ -n "$want_sc" ] || { echo "::error::no shellcheck pin found in the justfile's _shellcheck-pin recipe"; exit 1; }

          case "$want_sc:$RUNNER_OS" in
            0.11.0:Linux)
              sc_asset="shellcheck-v0.11.0.linux.x86_64.tar.xz"
              sc_sha="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" ;;
            0.11.0:macOS)
              sc_asset="shellcheck-v0.11.0.darwin.aarch64.tar.xz"
              sc_sha="56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79" ;;
            *)
              echo "::error::no pinned digest recorded for shellcheck $want_sc on $RUNNER_OS — add its asset name and sha256 beside the others in this step"
              exit 1 ;;
          esac
          case "$SHFMT_VERSION:$RUNNER_OS" in
            3.13.1:Linux)
              sh_asset="shfmt_v3.13.1_linux_amd64"
              sh_sha="fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1" ;;
            3.13.1:macOS)
              sh_asset="shfmt_v3.13.1_darwin_arm64"
              sh_sha="9680526be4a66ea1ffe988ed08af58e1400fe1e4f4aef5bd88b20bb9b3da33f8" ;;
            *)
              echo "::error::no pinned digest recorded for shfmt $SHFMT_VERSION on $RUNNER_OS — add its asset name and sha256 beside the others in this step"
              exit 1 ;;
          esac

          bin="$CARGO_INSTALL_ROOT/bin"
          tmp="$RUNNER_TEMP/bash-tools"
          mkdir -p "$bin" "$tmp"

          # ASK EACH TOOL WHAT IT IS. A cache restored from before a bump still
          # holds the old binary — the key moves with the pin, but only for the
          # run after the bump — so presence is not the question, version is.
          sc_have="$(shellcheck --version 2>/dev/null | awk '/^version:/ {print $2}' || true)"
          if [ "$sc_have" = "$want_sc" ]; then
            echo "shellcheck $want_sc already present"
          else
            curl -fsSL --retry 3 --output "$tmp/$sc_asset" \
              "https://github.com/koalaman/shellcheck/releases/download/v$want_sc/$sc_asset"
            echo "$sc_sha  $tmp/$sc_asset" | shasum -a 256 -c -
            tar -xJf "$tmp/$sc_asset" -C "$tmp"
            cp "$tmp/shellcheck-v$want_sc/shellcheck" "$bin/shellcheck"
            chmod 0755 "$bin/shellcheck"
          fi

          # The release binary answers `v3.13.1`; a source build answers
          # `3.13.1`. Compare on the number so either satisfies the pin.
          sh_have="$(shfmt --version 2>/dev/null | sed 's/^v//' || true)"
          if [ "$sh_have" = "$SHFMT_VERSION" ]; then
            echo "shfmt $SHFMT_VERSION already present"
          else
            curl -fsSL --retry 3 --output "$tmp/$sh_asset" \
              "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/$sh_asset"
            echo "$sh_sha  $tmp/$sh_asset" | shasum -a 256 -c -
            cp "$tmp/$sh_asset" "$bin/shfmt"
            chmod 0755 "$bin/shfmt"
          fi

          # A digest proves BYTES, not that the bytes are the tool this lane
          # wants. Ask both again, now that PATH decides which one answers.
          sc_now="$(shellcheck --version 2>/dev/null | awk '/^version:/ {print $2}' || true)"
          [ "$sc_now" = "$want_sc" ] || { echo "::error::shellcheck on PATH is ${sc_now:-absent}, want $want_sc"; exit 1; }
          sh_now="$(shfmt --version 2>/dev/null | sed 's/^v//' || true)"
          [ "$sh_now" = "$SHFMT_VERSION" ] || { echo "::error::shfmt on PATH is ${sh_now:-absent}, want $SHFMT_VERSION"; exit 1; }
          echo "bash lane ready: shellcheck $sc_now, shfmt $sh_now"

      # THE BASH LANE ITSELF, and `install` is the whole of its subject: 79 lines
      # that have to run before there is a core to run, published as a member of
      # every release bundle. It runs here, ahead of the Rust lanes, because it
      # costs seconds and needs nothing they build.
      - name: just check (shellcheck + shfmt over install)
        run: just check

      # The bootstrap contract, exercised for real: rustup + just -> rust-setup.
      - name: just rust-setup
        run: just rust-setup

      # Idempotence is an ACCEPTANCE CRITERION, so CI asserts it rather than
      # trusting it: a second run must install nothing.
      - name: just rust-setup is idempotent
        run: |
          set -euo pipefail
          just rust-setup 2>&1 | tee "$RUNNER_TEMP/setup2.log"
          if grep -q 'installing' "$RUNNER_TEMP/setup2.log"; then
            echo "::error::rust-setup installed something on its second run — not idempotent"
            exit 1
          fi
          echo "second run installed nothing"

      - name: just rust-check
        run: just rust-check

      - name: just rust-deny
        run: just rust-deny

      # Supply-chain PROVENANCE (arrived with the first dependency, P4.3).
      # `--locked` uses the pinned supply-chain/imports.lock, so this needs no
      # network and no fetch. Orthogonal to rust-deny; see the recipe comment.
      - name: just rust-vet
        run: just rust-vet


      # Native build only. The musl compile-smoke that used to live in this
      # recipe was removed at the first dependency: `ring` compiles C for the
      # target, so a musl `cargo check` now needs a musl C toolchain, and the
      # musl artifact is built+proven for real on the Linux leg below instead.
      - name: just rust-build-release
        run: just rust-build-release

      # THE target-native proof: this binary was built by this machine, for this
      # machine, and is executed here.
      - name: Native ae runs on this platform
        run: |
          set -euo pipefail
          want="ae $(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)"
          got="$(./target/release/ae --version)"
          [ "$got" = "$want" ] || { echo "::error::--version printed '$got', want '$want'"; exit 1; }

          # Exit codes are part of the contract. Capture the status explicitly:
          # under `set -e` a bare failing command aborts, and wrapping it in
          # `cmd && { ... }` to dodge that makes the status the reader sees
          # depend on short-circuit rules rather than on the binary.
          set +e
          ./target/release/ae --frobnicate >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "::error::unknown arg exited $code, want 2"; exit 1; }

          echo "native proof ok on ${{ matrix.name }}: $got"

      # Evidence, not a release channel — hence the short retention.
      #
      # HONEST LABEL: on ubuntu this is the NATIVE host build, which is
      # x86_64-unknown-linux-GNU and dynamically linked. The static musl artifact
      # ae ships is built and proven separately, below.
      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ae-${{ matrix.name }}-native
          path: target/release/ae
          retention-days: 7
          if-no-files-found: error

      # ring's build script compiles C for the target, so the musl build needs a
      # musl C toolchain. `musl-tools` provides `musl-gcc`, which the `cc` crate
      # selects for a same-arch musl target. Linux-only: this is the only leg
      # that links musl, and macOS no longer touches the target at all (the
      # compile-smoke was removed with the first dependency). CONFIGURED here,
      # proven on the first CI run after this lands — the same "configured, not
      # yet observed" status the zero-dependency musl proof once had.
      - name: Install musl C toolchain (ring compiles C for the musl target)
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools

      # ── The epic's promise, proven rather than asserted ────────────────────
      #
      # Only on Linux: a musl target can actually LINK here, so this leg builds
      # the real static artifact. macOS does NOT touch the musl target — the
      # compile-smoke that used to run there was removed at the first dependency
      # (ring compiles C; a macOS laptop has no musl cross toolchain), so the one
      # place musl is exercised is right here.
      #
      # A musl-static binary runs fine on a glibc host, so it is EXECUTED here,
      # not just built.
      #
      # `.cargo/config.toml` pins the musl linker to the macOS cross
      # toolchain's name (`x86_64-unknown-linux-musl-gcc`), because that is
      # where `just bundles` links this target on a laptop. `musl-tools` ships
      # `musl-gcc` and no triple-prefixed alias, so this leg names its own. A
      # config value an env var overrides is still the pin: it is what holds
      # when nobody says otherwise.
      - name: Build, run and prove the static musl binary
        if: matrix.name == 'linux-x86_64'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/release/ae

          # Same proof shape as the native lane: it prints what it should, and
          # its exit codes are the contract.
          want="ae $(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)"
          got="$("$bin" --version)"
          [ "$got" = "$want" ] || { echo "::error::musl --version printed '$got', want '$want'"; exit 1; }

          set +e
          "$bin" --frobnicate >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "::error::musl unknown arg exited $code, want 2"; exit 1; }

          # STATIC IS ASSERTED, NOT PRINTED. A skipped assertion is a vacuous
          # gate, so a missing readelf is a failure rather than a silent pass.
          command -v readelf >/dev/null || { echo "::error::readelf missing — cannot prove static"; exit 1; }

          # The authoritative test is the absence of a PT_INTERP segment: no
          # program interpreter means no dynamic loader is involved. Capture
          # first so a readelf that FAILS aborts here — piping straight into
          # grep would turn a broken readelf into "no INTERP found", i.e. a pass.
          headers="$(readelf -l "$bin")"
          if printf '%s\n' "$headers" | grep -q 'INTERP'; then
            echo "::error::musl binary has a PT_INTERP segment — it is dynamically linked"
            printf '%s\n' "$headers"
            exit 1
          fi

          # Second, independent signal. Rust musl builds are static-pie, which
          # `file` spells "static-pie linked" or "statically linked" depending on
          # version — both contain "static"; a dynamic build says "dynamically".
          described="$(file -b "$bin")"
          case "$described" in
            *dynamically*) echo "::error::file reports dynamic: $described"; exit 1 ;;
            *static*)      : ;;
            *)             echo "::error::file does not report static: $described"; exit 1 ;;
          esac

          # Third signal, informational: on glibc, ldd exits non-zero for a
          # static binary, so it must not be allowed to abort the step.
          ldd "$bin" 2>&1 || true

          echo "static musl proof ok: $got — $described"

      # THE musl DNS/NSS CHECK P4 OWED (AGENTS.md, "The linux target is musl").
      # musl has no NSS: it does not consult /etc/nsswitch.conf, so a static musl
      # binary's `getaddrinfo` is not the one glibc gives. The Telegram bridge
      # resolves api.telegram.org for real, and the check could not run on the
      # laptop — there is no musl toolchain there. This is the only place the
      # artifact and a real resolver exist together, so this is the proof of
      # record. It costs no credential and opens no connection: `_net-probe`
      # resolves and reports.
      #
      # THE NEGATIVE CONTROL RUNS FIRST, and it is not decoration: a probe that
      # answered `ok` unconditionally would pass the positive case forever. A
      # reserved `.invalid` name (RFC 6761) can never resolve, so an `ok` there
      # means the instrument is not measuring a resolver and this step is
      # vacuous — which is a failure, not a pass.
      - name: musl DNS/NSS — the static binary resolves a real name
        if: matrix.name == 'linux-x86_64'
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/ae

          set +e
          "$bin" _net-probe ae-net-probe-must-never-resolve.invalid >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 1 ] || {
            echo "::error::the probe exited $code for a reserved .invalid name — it is not measuring a resolver, so the check below would be vacuous"
            exit 1
          }

          out="$("$bin" _net-probe api.telegram.org)" || {
            echo "::error::static musl ae could not resolve api.telegram.org — musl has no NSS, and this is the failure P4 recorded as possible"
            exit 1
          }
          case "$out" in
            ok\ *) : ;;
            *) echo "::error::unexpected probe output: $out"; exit 1 ;;
          esac
          echo "musl DNS/NSS proof ok: $out"

      - name: Upload static musl binary
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ae-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/ae
          retention-days: 7
          if-no-files-found: error

      # LAST, deliberately: everything above is evidence this job exists to produce
      # (checks, supply chain, the native build, and on Linux the static musl binary and
      # its DNS proof). The mutation lane below is bounded in SCOPE but not in TIME — a
      # broad source change can still fill the 45-minute budget — so it runs only after
      # that evidence is in, and a timeout here cancels nothing that matters.
      # The lane that asks whether the tests discriminate. Run on both platforms:
      # a mutant caught on macOS is not evidence about Linux. Per push it is BOUNDED
      # to the mutants that touch the pushed range (cargo-mutants' incremental mode,
      # --in-diff): the first full run in CI was cancelled by the 45-minute budget while
      # still in src/archive.rs, and the step then sat BEFORE the musl steps, so an
      # unbounded run starved the evidence after it — hence its place at the end now.
      # The full lane stays available as
      # a manual dispatch with mutants=true under the 6-hour budget. This workflow lives
      # on the default branch, so GitHub's schedule-from-default restriction no longer
      # blocks a scheduled full run; the cadence itself is an owner decision and is
      # deliberately not activated.
      - name: just rust-mutants --in-diff (the pushed range)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch's first push has an all-zero 'before'; there is no range to bound
          # to, and an unbounded run does not fit the budget — say so and skip, loudly.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::mutation lane NOT RUN: no pushed range to bound it to (base='${base:-none}'); run the full lane by manual dispatch (mutants=true, once dispatchable)"
            { echo '### Mutation lane: not run'; echo "No pushed range to bound the mutation step to (base='${base:-none}')."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # KNOWN GAP, detected on its own and named wherever it bites: in-diff selects SOURCE
          # mutants only, so a change to tests or to anything that shapes how tests run
          # (Cargo, the toolchain pin, tool configs, the justfile, this workflow) can weaken
          # a test — or drop a lane — while a previously caught mutant elsewhere survives,
          # and the bounded run below cannot see it even when src/ changed too. Failing
          # closed would need a runnable full lane, and none is reachable from this branch
          # (dispatch and schedule fire from the default branch, where this file does not
          # exist). Until that stub lands there, this step SAYS so, in an annotation and in
          # the job summary; it does not pretend to be a gate. The inventory mirrors the
          # workflow's own trigger paths minus src/ — and minus `install`, which is
          # bash, carries no mutant to select, and is gated by `just check` above.
          infra='tests Cargo.toml Cargo.lock rust-toolchain.toml deny.toml clippy.toml taplo.toml supply-chain .cargo justfile .github/workflows/rust.yml'
          # shellcheck disable=SC2086  # the inventory is a deliberate word list
          if ! git diff --quiet "$base" "${{ github.sha }}" -- $infra; then
            changed="$(git diff --name-only "$base" "${{ github.sha }}" -- $infra | tr '\n' ' ')"
            echo "::warning::mutation lane GAP: the pushed range changes tests or test infrastructure ($changed) — in-diff cannot detect a weakened test or a dropped lane; run the full lane (manual dispatch, mutants=true, once dispatchable)"
            { echo '### Mutation lane: known gap'; echo "The pushed range changes tests or test infrastructure: $changed"; echo 'The diff-bounded mutation step selects source mutants only, so a weakened test or a dropped lane is invisible to this job. Run the full lane by manual dispatch (mutants=true) once the workflow is dispatchable from the default branch.'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          git diff "$base" "${{ github.sha }}" -- src > "$RUNNER_TEMP/push.diff"
          if [ ! -s "$RUNNER_TEMP/push.diff" ]; then echo "no Rust source change in the pushed range; nothing to mutate"; exit 0; fi
          just rust-mutants --in-diff "$RUNNER_TEMP/push.diff"
      - name: just rust-mutants (full lane, manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.mutants
        run: just rust-mutants

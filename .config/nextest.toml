# Test scheduling for the integration target.
#
# A BARE run (no `just`, no NEXTEST_TEST_THREADS exported) starts at most four
# tests at once, whatever the core count: every one starts real processes (tmux,
# fake tools, the product), a fully parallel run on a big machine measured load
# 26 and starved its own waits (#159), and several agent sessions share one
# machine. Four is the small count the repo already uses where it has to pick
# one (the Linux container lanes, `NEXTEST_TEST_THREADS=4`), and half of the
# number a bare run started before. The isolated lane (`just test`) does NOT
# read this number: it sizes itself and exports NEXTEST_TEST_THREADS, the least
# of the free cores, eight and an inherited value (docs/development.md), and
# an environment value beats this file. So a shell that exports
# NEXTEST_TEST_THREADS (a fixed 16, or `-2`) makes a bare `cargo nextest run`
# follow the export, not this default; run the gate through `just test` or pass
# --test-threads. Every test-group cap below stays: they bound the real-tmux
# modules whatever the thread count is.
[profile.default]
test-threads = 4
# Finish the run after failures so one red gate reports every failing test.
fail-fast = false

# The per-test seconds of every default-profile run, written to
# target/nextest/default/junit.xml. A whole `just test` reads it for the gate ledger
# (`LEDGER` in the justfile, docs/development.md): test-seconds, thread-seconds, the
# 30 slowest tests and the change since the last entry. It is a report; nothing here
# changes how a test is scheduled, run or judged.
[profile.default.junit]
path = "junit.xml"

# Writer acceptance starts two or three real app panes per fixture and holds
# their read/dispatch boundaries. Keep concurrent fixtures small enough that
# the bounded chat refusal and rendered frames can make progress.
[test-groups.app-writers]
max-threads = 2

[[profile.default.overrides]]
filter = 'test(/^app_(writer|selected)_spec::/)'
test-group = 'app-writers'

# The `menu` module drives a REAL tmux server and real attached clients, then
# polls until a client renders. Every test in it starts one or two servers and
# several clients, so a fully parallel run can starve a client the test is
# waiting on behind its siblings' redraws. Keep the whole module in one small
# group: the class is defined by the module, so a menu test added tomorrow is
# covered the day it lands, and the other slots stay free for the rest of the
# suite. This is a scheduling fact, not a retry: no test is skipped, retried or
# weakened, and the waits themselves still fail if a client never renders.
# `o4jump_spec` is the same class: real attached clients jumped between sessions.
[test-groups.tmux-clients]
max-threads = 3

[[profile.default.overrides]]
filter = 'test(/^(menu|o4jump_spec)::/)'
test-group = 'tmux-clients'

# The `reseat` module drives a REAL tmux server too, but the resource it is
# sensitive to is TIME, not a client: the stop reads a pane's frame TWICE a
# second apart and then waits up to ten seconds for a respawned shell, and one
# pin deliberately holds a pane that never returns. Under a fully parallel run
# those waits and a sibling's fake tool drawing its frame compete for the same
# cpu, and a frame that has not finished drawing reads as a different verdict.
# Same reasoning as above, same shape: the module is the class, so a reseat
# test added tomorrow is covered, and nothing is skipped, retried or weakened.
[test-groups.tmux-seats]
max-threads = 2

# `reseat_carry` is the same class: the same rig, the same stop, the same waits.
# `effort_live_spec` drives real watchdogs and the same restart_in_place stop:
# share these slots to limit contention during their safe-point and recovery
# waits at release scheduling. Nothing skipped, retried or weakened.
[[profile.default.overrides]]
filter = 'test(/^(reseat(_carry)?|effort_live_spec)::/)'
test-group = 'tmux-seats'

# `spawn::tests::tmux_*`: same class again — socket-pinned REAL tmux
# servers spun per pin, so small group, module-anchored filter.
[test-groups.tmux-spawn-unit]
max-threads = 2

[[profile.default.overrides]]
filter = 'test(/^spawn::tests::tmux_/)'
test-group = 'tmux-spawn-unit'

# The stamp-hold FIFO proof (compact::) blocks in open(2) if the hold ever
# loses O_NONBLOCK. End that one test instead of waiting out the default.
[[profile.default.overrides]]
filter = 'test(=compact::a_writerless_fifo_swapped_in_after_lstat_is_refused_without_blocking)'
slow-timeout = { period = "5s", terminate-after = 2 }

# The Linux container lane runs the WHOLE suite with a bound: fail-fast off, so
# one run lists every Linux-only failure instead of hiding the ~1830 tests
# behind the first two, and a hard terminate-after for the three menu-client
# waits that hung in a container until #187 (30 s x 2).
# Per nexte.st/config per-test-overrides, a
# selected profile's overrides are checked FIRST and profile.default.overrides
# SECOND, per setting — so the default profile's test-group overrides
# (tmux-clients, tmux-seats, tmux-spawn-unit) still apply under linux, and the
# default profile and the host gate stay byte-identical.
[profile.linux]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The menu hangs are bounded only; test-group falls through to the default
# profile's override, which is still consulted for settings this does not set.
[[profile.linux.overrides]]
filter = 'test(/^menu::/)'
slow-timeout = { period = "30s", terminate-after = 2 }

# Every cargo-mutants run (`.cargo/mutants.toml` selects this profile) is
# bounded in CONFIG, for the baseline and every mutant alike. A mutant that
# turns a loop bound into an unbounded allocation drives its test to GBs of RSS
# in seconds, and on macOS no rlimit can stop it (`ulimit -v` is EINVAL, `-d`
# limits sbrk only). So: at most TWO tests at once, and each one is killed
# after 60 s (30 s x 2), except the three named tests at the end of this
# profile, each killed after 180 s (90 s x 2). nextest sends SIGTERM
# there and SIGKILL a grace period later (10 s unless named), so the grace is
# zero: a test that handles SIGTERM must not outlive the bound. The lane may
# TIGHTEN the thread count with NEXTEST_TEST_THREADS but clamps anything wider
# to two. Settings this profile does not name, and the default profile's
# test-group and per-test overrides, still apply as under `linux`.
[profile.mutants]
test-threads = 2
# Stop at the first failure: a caught mutant needs no remaining tests.
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "0s" }

# The three tests below passed in 79.8 s, 67.2 s and 87.3 s in one whole-gate
# run (two threads, #234), so the 60 s kill ends valid runs. Each gets ONE
# finite exception: an exact-name filter and a hard
# kill at 180 s (90 s x 2, grace zero), a chosen margin and not a derived bound.
# A timeout is termination and is never a caught mutant. Only this profile may
# widen a kill. `mutants_timeout_policy` in tests/it/gate.rs reads these blocks
# byte for byte: exactly these three names, once each, each a header, one
# filter line and one slow-timeout line with nothing between them (put comments
# above the header). Another name, a broader selector, a longer kill or a
# default/linux timeout change needs an explicit ruling and a policy amendment.
[[profile.mutants.overrides]]
filter = 'test(=autotrust_spec::measured_yes_and_no_use_only_the_arrow_then_enter_once_across_watchdog_restart)'
slow-timeout = { period = "90s", terminate-after = 2, grace-period = "0s" }

[[profile.mutants.overrides]]
filter = 'test(=reseat_headroom_spec::a_readable_unknown_frame_holds_headroom_instead_of_stopping_the_tool)'
slow-timeout = { period = "90s", terminate-after = 2, grace-period = "0s" }

[[profile.mutants.overrides]]
filter = 'test(=reseat_headroom_spec::busy_and_draft_holds_do_not_spend_attempts_and_move_after_idle)'
slow-timeout = { period = "90s", terminate-after = 2, grace-period = "0s" }

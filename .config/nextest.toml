# Test scheduling for the integration target.
#
# The `menu` module drives a REAL tmux server and real attached clients, then
# polls until a client renders. Every test in it starts one or two servers and
# several clients, so a fully parallel run can starve a client the test is
# waiting on behind its siblings' redraws. Keep the whole module in one small
# group: the class is defined by the module, so a menu test added tomorrow is
# covered the day it lands, and the other slots stay free for the rest of the
# suite. This is a scheduling fact, not a retry: no test is skipped, retried or
# weakened, and the waits themselves still fail if a client never renders.
[test-groups.tmux-clients]
max-threads = 3

[[profile.default.overrides]]
filter = 'test(/^menu::/)'
test-group = 'tmux-clients'

# The `reseat` module drives a REAL tmux server too, but the resource it is
# sensitive to is TIME, not a client: the stop reads a pane's frame TWICE a
# second apart and then waits up to ten seconds for a respawned shell, and one
# pin deliberately holds a pane that never returns. Under a fully parallel run
# those waits and a sibling's fake tool drawing its frame compete for the same
# cpu, and a frame that has not finished drawing reads as a different verdict.
# Same reasoning as above, same shape: the module is the class, so a reseat
# test added tomorrow is covered, and nothing is skipped, retried or weakened.
[test-groups.tmux-seats]
max-threads = 2

# `reseat_carry` is the same class: the same rig, the same stop, the same waits.
[[profile.default.overrides]]
filter = 'test(/^reseat(_carry)?::/)'
test-group = 'tmux-seats'

# `spawn::tests::tmux_*`: same class again — socket-pinned REAL tmux
# servers spun per pin, so small group, module-anchored filter.
[test-groups.tmux-spawn-unit]
max-threads = 2

[[profile.default.overrides]]
filter = 'test(/^spawn::tests::tmux_/)'
test-group = 'tmux-spawn-unit'

# Single crate, bin + lib, named `ae` from day one (epic #79). No workspace:
# dead-code analysis stops at crate boundaries, and cross-crate dead code is the
# agent "reinvention" failure mode. Split later only on measured need.
[package]
name = "ae"
# This version tracks the shipping ae product version. The bash era versions ae with
# SemVer-compatible CalVer (`YYYY.M.N`), held equal to `AE_VERSION` in the `ae`
# script. `just bump` derives N from matching release tags and updates both
# version files plus `Cargo.lock` together.
# WHY IT MOVED OFF 0.0.0: delivery-first brought the entry flip's trigger
# forward. The two versions may not disagree where a user can see both, and
# `ae --version` prints this one — so while this binary is something a person
# runs, 0.0.0 was not a placeholder, it was false product information.
# Keep this equal to `AE_VERSION`; the two schemes are unified before promotion.
version = "2026.8.2"
edition = "2024"
rust-version = "1.97.1"
description = "Agent environment: tmux-backed multi-agent session multiplexer"
license = "MIT"
repository = "https://github.com/clemens33/ae"
publish = false

[lib]
name = "ae"
path = "src/lib.rs"

[[bin]]
name = "ae"
path = "src/main.rs"

# Single integration-test target with `mod` submodules — one binary to link,
# one place for shared helpers, no per-file target explosion.
[[test]]
name = "it"
path = "tests/it/main.rs"

# ae's FIRST runtime dependencies, and the last for a long while. They arrive
# WITH the feature that needs them (P4.3 tracer A: the outbound Telegram
# bridge), never in a skeleton — #80's "no error dependency exists until a real
# error does", generalised. Everything else stays std: CLI parsing, JSON,
# errors, time and the unix/fs surface are ours by ratified decision (AGENTS.md
# "Dependency posture"), and this row does not reopen any of them.
#
# THREE COSTS ARE PAID BY THIS TABLE BEING NON-EMPTY, all recorded before the
# first line was written (AGENTS.md, "Costs of the first [dependencies] row"):
#   1. `just rust-deny` drops `--allow license-not-encountered` — from now an
#      unmatched allow-list entry is drift, not the zero-dependency baseline.
#   2. The clippy `disallowed_types` / `disallowed_methods` capability
#      boundaries lose their empty-dep-tables premise and degrade toward a
#      naming convention. Documented at the site: clippy.toml.
#   3. cargo-vet arrives with this change. Its direct TLS graph (ring, rustls,
#      ureq) is EXEMPTED, not audited: no registry certifies these exact versions,
#      no trusted-publisher path exists, and ring is 261k lines of crypto no one
#      here can credibly attest. So the exemption honestly encodes an ACCEPTED
#      RISK, recorded on the record in AGENTS.md (a project-local decision, with
#      revisit triggers), never a provenance claim — cargo-deny still gates the
#      whole graph for advisories.
#
# WHY THESE, exactly: TLS HTTP is the one surface std does not cover, and a
# session multiplexer that talks to Telegram over the public internet may not
# hand-roll it. ureq is blocking (no async runtime for two background loops),
# rustls is memory-safe TLS, ring is the pinned crypto provider — pinned
# EXPLICITLY rather than left to ureq's default, whose docs reserve the right to
# change it, because a static musl binary's provider is not a detail to
# discover in production. attohttpc was rejected on license (MPL-2.0 against
# deny.toml's permissive allow-list); reqwest/hyper drag in tokio.
#
# EXACT versions (`=`), not carets: "pins, not channels" is the toolchain rule
# and it applies to the dependency graph too. `Cargo.lock` is committed; a bump
# is a deliberate commit, and cargo-deny's `wildcards = "deny"` agrees.
[dependencies]
# `default-features = false` drops ureq's `gzip` (flate2) and leaves `json`
# (serde/serde_json) off — we parse Telegram's replies with `crate::json`, which
# already bounds nesting at MAX_DEPTH and keeps oversized integers verbatim.
#
# `rustls-no-provider` takes the rustls transport WITHOUT ureq choosing the
# crypto provider for us (that is `src/telegram.rs`'s job, explicitly).
# `rustls-webpki-roots` is NOT optional decoration: with the feature off,
# ureq's default `RootCerts::WebPki` reaches a `panic!("WebPki is disabled...")`
# at the first request (ureq-3.4.0 src/tls/rustls.rs:200). Mozilla's root set,
# compiled in, is also the right answer for a static musl binary that cannot
# rely on a host trust store being present or readable.
ureq = { version = "=3.4.0", default-features = false, features = [
  "rustls-no-provider",
  "rustls-webpki-roots",
] }
# A DIRECT dependency purely to name the provider: `ring`, chosen rather than
# inherited. `std` is stated rather than relied upon — feature unification would
# supply it from ureq today, and a pin that depends on another crate's feature
# list is not a pin.
rustls = { version = "=0.23.35", default-features = false, features = [
  "ring",
  "std",
] }

# The fake Telegram server the outbound gate runs against is a `std::net`
# TcpListener in the test module itself: a test double that needed a dependency
# would be a second network stack to trust.
[dev-dependencies]

[lints.rust]
# The hard line. Not "warn": there is no scoped exception worth having in a
# session multiplexer that shells out to tmux.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The exact escape hatch agents reach for when the type system gets
# inconvenient. WARN, not deny: `-D warnings` in CI gives the same gate
# strength, and deny would break a scoped, documented `#[allow]`.
unwrap_used = "warn"
expect_used = "warn"
# DENY, unlike the two above: this one is a capability boundary rather than a
# style rule, and the scoped relaxations that open a door are meant to be
# conspicuous. The type it denies, and why denying one type is sufficient HERE,
# are documented in clippy.toml.
#
# There are THREE doors crate-wide, doing different jobs: the product's, in
# `src/transport.rs`, because ae cannot answer a liveness question without
# running tmux; the parity harness's, in `tests/it/parity.rs`'s `mod raw`; and
# the black-box CLI tests', which must run the product binary. Not `forbid`:
# forbid would block all three, so the residual is that a further relaxation
# would open a further door. A self-test inventories them by FILE and COUNT —
# where, not merely how many. That inventory is textual and closes only the
# relaxation forms it enumerates; the type deny above is semantic and closes the
# class. They are not the same strength, and tests/it/parity.rs documents the
# difference.
disallowed_types = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
# REVISIT IF A DAEMON LOOP NEEDS TO SURVIVE A PANIC. `panic = "abort"`
# forecloses `catch_unwind`: the long-lived watchdog/telegram loop may want to
# survive a panic in one iteration rather than take the process down. Cheap to
# flip; recorded so the trade stays a decision rather than a discovery.
panic = "abort"
